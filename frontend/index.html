<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <!-- use-credentials: manifest 요청은 기본이 쿠키 미포함이라, Vercel preview의
         Deployment Protection 쿠키가 안 실려 vercel.com SSO로 리다이렉트되며 CORS로 죽는다. -->
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <!-- viewport-fit=cover: 없으면 iOS에서 env(safe-area-inset-*)가 전부 0으로 평가돼
         탭바·셸의 노치/홈 인디케이터 패딩이 동작하지 않는다. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0a0f" />
    <title>Mongle</title>
    <!-- FOUC 방지: 테마 class를 첫 페인트 전에 적용한다. ThemeProvider가 .dark만
         토글하므로 여기도 dark일 때만 .dark를 붙인다(라이트=class 없음). 저장값 우선,
         기본은 고요의 밤 캔버스(dark). theme-color도 같은 값으로 맞춘다. -->
    <script>
      ;(function () {
        try {
          var theme =
            localStorage.getItem('mongle-theme') === 'light' ? 'light' : 'dark'
          if (theme === 'dark') document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta)
            meta.setAttribute(
              'content',
              theme === 'dark' ? '#0c0a0f' : '#faf9fc',
            )
        } catch (e) {}
      })()
    </script>
  </head>
  <body data-amp-mask-attributes="aria-label,alt,title">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
